# cargo-deny policy: licenses, security advisories, and banned crates.
[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained (not vulnerable). Only reached through heapless 0.7 on targets
    # without native atomics, which this desktop app never builds for.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unused on desktop targets" },
    # Unmaintained (not vulnerable), both via keyring 2 -> secret-service -> zbus 3 on
    # Linux. Moving the keystore to keyring 3 removes them.
    { id = "RUSTSEC-2024-0388", reason = "derivative: transitive via keyring 2 (Linux Secret Service)" },
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive via keyring 2 (Linux Secret Service)" },
]

[licenses]
version = 2
# Permissive licenses acceptable for a locally-distributed desktop app.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
