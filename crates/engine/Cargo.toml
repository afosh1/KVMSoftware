[package]
name = "kvm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Orchestrator for the LAN KVM: owns the tokio runtime and wires core domain, transport, OS adapters, discovery, and pairing behind a command/event API."

[dependencies]
kvm-core = { path = "../core" }
kvm-proto = { path = "../proto" }
kvm-transport = { path = "../transport" }
kvm-adapter-api = { path = "../adapter-api" }
kvm-discovery = { path = "../discovery" }
kvm-pairing = { path = "../pairing" }
kvm-keystore = { path = "../keystore" }
tokio = { workspace = true, features = ["fs"] }
bytes.workspace = true
uuid.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
